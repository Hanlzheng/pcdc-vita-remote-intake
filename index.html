<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PCDC VITA 免费报税协助申请 | VITA Free Tax Filling Application</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!--Header-->
        <header class="site-header">
            <div class="header-inner">
                <div class="logo-area">
                    <div class="log-img">PCDC</div>
                    <div class="logo-text-wrap">
                        <div class="logo-title" data-zh="VITA 免费报税" data-en="VITA Free Tax Filling"> </div>
                        <div class="log-sub" data-zh="费城华埠发展会" data-en="Philadelphia Chinatown Development Corporation">费城华埠发展会</div>
                    </div>
                </div>
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLang('zh')" id="btn-zh">中文</button>
                    <button class="lang-btn" onclick="setLang('en')" id="btn-en">English</button>
                </div>
            </div>
        </header>

        <!-- Progress -->
        <div class="progress-wrap">
            <div class="progress-inner">
                <div class="steps-row" id="steps-row"></div>
            </div>
        </div>

        <!-- Main -->
         <div class="main">
            <!-- STEP 1: Eligibility -->
            <div class="card">
                <div class="card-header">
                    <div class="card-step" data-zh="第一步 · 资格筛查" data-en="Step 1 · Eligibility Screening">第一步 · 资格筛查</div>
                    <div class="card-title" data-zh="您是否符合服务资格？" data-en="Are you eligible for our service?">您是否符合服务资格？</div>
                    <div class="card-sub" data-zh="请如实回答以下问题。任何一项不符合，我们将说明原因并提供联系方式。" 
                    data-en="Please answer the questions below. If any condition is not met, we will explain why and provide contact information.">
                    请如实回答以下问题。任何一项不符合，我们将说明原因并提供联系方式。</div>
                </div>
            <div class="card-body">
                <div class="notice" data-zh="填写此表并不保证一定可以获得服务。我们将根据您所提供的信息进行资格审核，如符合条件，我们的团队将与您联系并告知后续步骤。" 
                        data-en="Completing this form does not guarantee service. Eligibility will be reviewed based on the information you provide, and our team will contact you with next steps if applicable.">
                        填写此表并不保证一定可以获得服务。我们将根据您所提供的信息进行资格审核，如符合条件，我们的团队将与您联系并告知后续步骤。</div>
                </div>
            </div>
         </div>
    </body>
</html>
